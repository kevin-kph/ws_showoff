<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KPH - Workshop</title>
  <meta name="description" content="A portfolio to show my work and art. Discover a website I designed to display my art">
  <meta name="color-scheme" content="light dark">
  <meta property="og:title" content="KPH Workshop">
  <meta property="og:description" content="A portfolio to show my work and art. Discover a website I designed to display my art.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234A3CF7'/%3E%3Ccircle cx='21' cy='12' r='7' fill='%23fff' fill-opacity='.85'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Applique le thème avant le premier affichage (évite le flash blanc) -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <a class="skip" href="#app">Contents</a>
  <div id="progress" aria-hidden="true"></div>

  <header class="site-header wrap">
    <a class="brand" href="#/" id="brand">KPH Workshop</a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="#/galerie" data-page="galerie">Gallery</a>
      <a href="#/blog" data-page="blog">Blog</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Change de theme">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      </button>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <p class="wrap loading">Loading…</p>
  </main>

  <footer class="site-footer wrap">
    <span id="footer-text"></span>
    <a href="#/">Go back up!</a>
  </footer>

  <!-- Visionneuse d'images -->
  <div id="lightbox" class="lb" role="dialog" aria-modal="true" aria-label="Visionneuse d'images" hidden>
    <button class="lb-btn lb-close" type="button" aria-label="Fermer">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="lb-btn lb-prev" type="button" aria-label="Image précédente">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <figure class="lb-fig">
      <img id="lb-img" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-btn lb-next" type="button" aria-label="Image suivante">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
